name: CI

# TESTING.md §6: every gate here is blocking on every PR. Playwright is
# deliberately not here — it runs on main and release candidates only, per
# that same section.

on:
  pull_request:
  push:
    branches: [main]

env:
  APP_ORIGIN: http://localhost:3000
  DATABASE_URL: postgresql+asyncpg://trinol_app:trinol_app@localhost:5432/trinol_os
  DATABASE_MIGRATION_URL: postgresql+asyncpg://trinol_migrator:trinol_migrator@localhost:5432/trinol_os

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trinol_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - run: uv sync --frozen

      # ADR-0006/DATABASE.md's two-role split (trinol_migrator/trinol_app)
      # is required in every environment, not just production — CI included.
      - name: Create trinol_migrator/trinol_app roles
        run: psql "postgresql://postgres:postgres@localhost:5432/trinol_os" -v ON_ERROR_STOP=1 -f ../../infrastructure/postgres/init.sql

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

      - name: alembic upgrade head (empty DB)
        run: uv run alembic upgrade head
      - name: alembic downgrade -1 && upgrade head
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head
      - run: uv run alembic check

      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  openapi-diff:
    # ADR-0005: "the CI diff check makes forgetting [to regenerate
    # types.gen.ts] impossible rather than merely embarrassing." Needs both
    # toolchains but no live database — app.openapi() only needs Settings to
    # construct, not a reachable Postgres (SQLAlchemy engines are lazy).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --frozen
        working-directory: apps/api

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Regenerate apps/web/lib/api/types.gen.ts
        run: |
          cd apps/api && uv run python -c "import json, trinol.main as m; json.dump(m.app.openapi(), open('openapi.json', 'w'))"
          cd ../web && pnpm generate:types

      - name: Fail if the committed types are stale
        run: git diff --exit-code apps/web/lib/api/types.gen.ts

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --frozen
        working-directory: apps/api
      - name: pip-audit
        working-directory: apps/api
        # Audits the synced venv directly (uv run --with overlays pip-audit
        # onto it without building a separate resolve-and-audit venv, which
        # crashed in local sandbox testing). --skip-editable, not --strict:
        # trinol-api itself is installed editable and isn't a PyPI package
        # to audit; --strict would fail on that skip itself, not just on an
        # actual vulnerability, which isn't the gate this is meant to be.
        run: uv run --with pip-audit pip-audit --skip-editable

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: pnpm audit
        # TESTING.md §6 says "npm audit" generically; this project only ever
        # uses pnpm (no package-lock.json exists), so pnpm's own equivalent
        # is the correct concrete gate, not a substitution of convenience.
        #
        # One known, accepted exception, not a blanket bypass: next@15.5.25
        # bundles its own internal postcss@8.4.31 (four disclosed CVEs, all
        # fixed upstream at >=8.5.23) — nothing to do with our own ^8.4.47
        # devDependency, which already resolves to a patched version on its
        # own. Tried a pnpm override to force next's copy too; confirmed
        # empirically (require.resolve from inside next, before/after a
        # forced reinstall, a package-specific `next>postcss` selector) that
        # pnpm's override mechanism can't reach a dependency a package
        # requires internally at an exact pin — removed it since it changed
        # nothing either way. Fixable only by a next.js release or adopting
        # pnpm's patchedDependencies to hand-patch next's own package.json,
        # neither of which belongs in a CI-setup change. This step still
        # fails hard on any advisory in any *other* package.
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --json > audit.json || true
          unexpected=$(jq '[.advisories[] | select(.module_name != "postcss")] | length' audit.json)
          if [ "$unexpected" != "0" ]; then
            echo "Advisory found outside the known, tracked postcss/next exception:"
            jq '.advisories[] | select(.module_name != "postcss")' audit.json
            exit 1
          fi
