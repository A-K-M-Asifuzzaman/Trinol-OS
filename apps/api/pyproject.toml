[project]
name = "trinol-api"
version = "0.1.0"
description = "Trinol OS API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "firebase-admin>=6.5",
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.30",
    "boto3>=1.35",
    "python-multipart>=0.0.12",
    "xhtml2pdf>=0.2.16",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query()/etc. in a default argument is the required FastAPI
# idiom, not the mutable-default-argument bug B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["trinol"]

[[tool.mypy.overrides]]
# Ships no type stubs or py.typed marker.
module = "firebase_admin.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Same: no type stubs or py.typed marker (boto3-stubs is a separate,
# much larger package not worth adding for four calls in s3.py).
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Same: no type stubs or py.typed marker.
module = "xhtml2pdf.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the session-scoped DB connection fixture
# in conftest.py holds a live asyncpg connection across tests, which breaks
# if pytest-asyncio hands out a fresh loop per test (the default).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trinol"]
